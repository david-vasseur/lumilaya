services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lumilaya
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - nginx-network
      - mongo-network
      - redis-network

networks:
  nginx-network:
    external: true
  mongo-network:
    external: true
  redis-network:
    external: true
    
