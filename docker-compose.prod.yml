services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: lumilaya
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - nginx-network
      - mongo-network

networks:
  nginx-network:
    external: true
  mongo-network:
    external: true
    
